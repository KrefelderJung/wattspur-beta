<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Wattspur-Knotennomenklatur – bildliche Beispiele</title>
  <desc id="desc">Drei schematische Messkonzepte mit HAK-Abgangsknoten, Sammelschienenknoten, Anlagenknoten und Zählerknoten.</desc>
  <style>
    .panel{fill:#16243a;stroke:#33445f;stroke-width:2}
    .title{fill:#f8fafc;font:700 24px system-ui,sans-serif}
    .subtitle{fill:#94a3b8;font:500 16px system-ui,sans-serif}
    .label{fill:#e2e8f0;font:700 15px system-ui,sans-serif}
    .small{fill:#94a3b8;font:500 13px system-ui,sans-serif}
    .wire{fill:none;stroke:#38bdf8;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .node{fill:#38bdf8;stroke:#0f172a;stroke-width:3}
    .meter{fill:#bae6fd;stroke:#0f172a;stroke-width:3}
    .asset{fill:#fde68a;stroke:#0f172a;stroke-width:3}
    .callout{fill:#0f172a;stroke:#38bdf8;stroke-width:2}
    .calloutText{fill:#7dd3fc;font:700 14px system-ui,sans-serif}
  </style>

  <rect width="1200" height="760" rx="22" fill="#0b1425"/>
  <text x="40" y="48" class="title">Knotennomenklatur – visuelle Beispiele</text>
  <text x="40" y="76" class="subtitle">Interne Wattspur-Begriffe für die Kommunikation über Geometrie und Leitungen</text>

  <!-- Example A -->
  <rect x="30" y="110" width="360" height="600" rx="16" class="panel"/>
  <text x="55" y="150" class="title">A · Standard-Schiene</text>
  <text x="55" y="177" class="subtitle">Ein Zähler, mehrere Anlagen</text>
  <rect x="191" y="202" width="58" height="38" rx="9" class="meter"/>
  <text x="220" y="227" text-anchor="middle" class="label" fill="#0c4a6e">Z1</text>
  <path d="M220 240 V300" class="wire"/>
  <circle cx="220" cy="300" r="8" class="node"/>
  <path d="M220 300 H350" class="wire"/>
  <path d="M270 300 V355 M310 300 V355 M350 300 V355" class="wire"/>
  <rect x="245" y="355" width="50" height="36" rx="9" class="asset"/>
  <rect x="285" y="355" width="50" height="36" rx="9" class="asset"/>
  <rect x="325" y="355" width="50" height="36" rx="9" class="asset"/>
  <text x="270" y="379" text-anchor="middle" class="label" fill="#78350f">EA</text>
  <text x="310" y="379" text-anchor="middle" class="label" fill="#78350f">EA</text>
  <text x="350" y="379" text-anchor="middle" class="label" fill="#78350f">EA</text>
  <rect x="58" y="263" width="120" height="31" rx="15" class="callout"/>
  <text x="118" y="284" text-anchor="middle" class="calloutText">SK · Sammelschiene</text>
  <path d="M178 278 H212" class="wire" stroke-width="2"/>
  <text x="256" y="325" class="small">AK1</text>
  <text x="296" y="325" class="small">AK2</text>
  <text x="336" y="325" class="small">AK3</text>
  <text x="62" y="500" class="small">SK → AK: gleicher Bus-zu-Anlage-Abstand</text>

  <!-- Example B -->
  <rect x="420" y="110" width="360" height="600" rx="16" class="panel"/>
  <text x="445" y="150" class="title">B · Unterzähler-Abgang</text>
  <text x="445" y="177" class="subtitle">Sammelschiene führt zusätzlich zu Z3</text>
  <rect x="574" y="202" width="58" height="38" rx="9" class="meter"/>
  <text x="603" y="227" text-anchor="middle" class="label" fill="#0c4a6e">Z2</text>
  <path d="M603 240 V300" class="wire"/>
  <circle cx="603" cy="300" r="8" class="node"/>
  <path d="M603 300 H730" class="wire"/>
  <path d="M650 300 V355 M690 300 V355 M730 300 V355" class="wire"/>
  <rect x="625" y="355" width="50" height="36" rx="9" class="asset"/>
  <rect x="665" y="355" width="50" height="36" rx="9" class="asset"/>
  <rect x="705" y="355" width="50" height="36" rx="9" class="asset"/>
  <text x="650" y="379" text-anchor="middle" class="label" fill="#78350f">EA</text>
  <text x="690" y="379" text-anchor="middle" class="label" fill="#78350f">EA</text>
  <text x="730" y="379" text-anchor="middle" class="label" fill="#78350f">EA</text>
  <path d="M730 300 V445" class="wire"/>
  <circle cx="730" cy="445" r="8" class="node"/>
  <rect x="701" y="462" width="58" height="38" rx="9" class="meter"/>
  <text x="730" y="487" text-anchor="middle" class="label" fill="#0c4a6e">Z3</text>
  <path d="M730 500 V555" class="wire"/>
  <rect x="705" y="555" width="50" height="36" rx="9" class="asset"/>
  <text x="730" y="579" text-anchor="middle" class="label" fill="#78350f">EA</text>
  <rect x="444" y="263" width="155" height="31" rx="15" class="callout"/>
  <text x="521" y="284" text-anchor="middle" class="calloutText">SK-Z · Schiene + Zähler</text>
  <path d="M599 278 H603" class="wire" stroke-width="2"/>
  <rect x="470" y="428" width="120" height="31" rx="15" class="callout"/>
  <text x="530" y="449" text-anchor="middle" class="calloutText">ZK3 · Zählerknoten</text>
  <path d="M590 443 H720" class="wire" stroke-width="2"/>
  <text x="445" y="640" class="small">SK-Z → ZK: eigener Zählerabstand</text>
  <text x="445" y="663" class="small">ZK → MK → EA: Einzelmessung</text>

  <!-- Example C -->
  <rect x="810" y="110" width="360" height="600" rx="16" class="panel"/>
  <text x="835" y="150" class="title">C · Einzelmessung</text>
  <text x="835" y="177" class="subtitle">Keine weitere Sammelschiene</text>
  <rect x="961" y="202" width="58" height="38" rx="9" class="meter"/>
  <text x="990" y="227" text-anchor="middle" class="label" fill="#0c4a6e">Z3</text>
  <path d="M990 240 V350" class="wire"/>
  <circle cx="990" cy="350" r="8" class="node"/>
  <rect x="965" y="372" width="50" height="36" rx="9" class="asset"/>
  <text x="990" y="396" text-anchor="middle" class="label" fill="#78350f">EA</text>
  <rect x="836" y="300" width="120" height="31" rx="15" class="callout"/>
  <text x="896" y="321" text-anchor="middle" class="calloutText">MK3 · Messknoten</text>
  <path d="M956 315 H990" class="wire" stroke-width="2"/>
  <text x="835" y="500" class="small">MK → Anlage: kurzer, gerader String</text>
  <text x="835" y="523" class="small">Keine horizontale Schiene erforderlich</text>
</svg>
