name: Wattspur Pages deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

# GitHub Pages benötigt für den offiziellen Deploy-Mechanismus sowohl die
# Seitenberechtigung als auch ein OIDC-Token. Beide Rechte werden bewusst
# explizit und nur für diesen Workflow vergeben.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Statische Website als Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Zu GitHub Pages deployen
        id: deployment
        uses: actions/deploy-pages@v4
